<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Nativo — Laboratorio web</title>
  <meta name="description" content="Experimento de 3D declarativo nativo con model-viewer y un modelo GLB real.">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="hero">
    <div class="stage">
      <model-viewer
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="Modelo 3D de un astronauta con traje blanco y visor dorado, flotando sobre un suelo neutro."
        camera-controls
        auto-rotate
        shadow-intensity="1.5"
        shadow-softness="0.8"
        environment-image="neutral"
        camera-orbit="35deg 75deg 105%"
        loading="eager"
        reveal="auto">
      </model-viewer>
    </div>

    <div class="copy">
      <p class="eyebrow">Experimento 02 · ECE·4D</p>
      <h1>3D Nativo</h1>
      <p class="hint">Arrastra para rotar</p>
    </div>

    <p class="credit">Astronaut.glb · modelviewer.dev</p>
  </main>
</body>
</html>
